<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>时间线 | 给你的一个小宇宙</title>
    <meta name="description" content="属于我们的时间线。">
    <link rel="stylesheet" href="styles.css?v=20260512-hero-fix">
  </head>
  <body>
    <canvas class="particle-canvas" aria-hidden="true"></canvas>
    <main class="page-shell content-shell">
      <section class="timeline panel single-page" id="timeline" aria-labelledby="timeline-title">
        <a class="back-link top-link" href="index.html">回到首页</a>
        <p class="section-kicker">Moments</p>
        <h1 id="timeline-title">我们的时间线</h1>
        <div class="moments">
          <article>
            <span>01</span>
            <h2>第一次心动</h2>
            <p>把这里改成你们第一次见面、第一次聊天，或者第一次让你确定她很特别的那一天。</p>
          </article>
          <article>
            <span>02</span>
            <h2>想一起记住的日子</h2>
            <p>可以写纪念日、旅行、一起吃过的饭，或者一张照片背后的故事。</p>
          </article>
          <article>
            <span>03</span>
            <h2>以后也要一起</h2>
            <p>把未来想一起完成的小愿望放在这里，让网页跟着你们的故事继续更新。</p>
          </article>
        </div>
      </section>
    </main>
    <script src="home-particles.js?v=20260512-distance-fix"></script>
  </body>
</html>
