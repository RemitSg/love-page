<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>礼物卡 | 给你的一个小宇宙</title>
    <meta name="description" content="三张可以刮开的礼物卡。">
    <link rel="stylesheet" href="styles.css?v=20260530-single-gift">
  </head>
  <body>
    <canvas class="particle-canvas" aria-hidden="true"></canvas>
    <header class="site-topbar">
      <div class="love-timer" aria-label="我们在一起的时间"></div>
      <button class="music-toggle" type="button" aria-label="播放背景音乐">♪</button>
    </header>
    <main class="page-shell content-shell">
      <section class="panel single-page gift-page" aria-labelledby="gift-title">
        <a class="back-link top-link" href="index.html">回到首页</a>
        <p class="section-kicker">Gift</p>
        <h1 id="gift-title">刮开奖励</h1>
        <div class="gift-carousel single-gift">
          <div class="gift-card" aria-live="polite">
            <div class="gift-image"></div>
            <canvas class="scratch-layer" aria-label="刮开礼物卡"></canvas>
          </div>
        </div>
        <div class="scratch-progress" aria-label="刮开进度">
          <span></span>
        </div>
        <button class="button ghost reset-scratch" type="button">重新覆盖</button>
      </section>
    </main>
    <script src="home-particles.js?v=20260512-distance-fix"></script>
    <script src="shared.js?v=20260512-expansion"></script>
    <script src="gift.js?v=20260530-single-gift"></script>
  </body>
</html>
